[package]
name = "pound"
version = "0.1.1"
edition = "2021"
description = "A small markdown reader with a side-by-side source pane"
license = "MIT"
authors = ["Hendry Chou"]
repository = "https://github.com/butageek/pound"
readme = "README.md"
keywords = ["markdown", "reader", "windows", "egui"]
categories = ["text-processing", "gui"]

[dependencies]
eframe = "0.32"
pulldown-cmark = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
open = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.60", features = [
    "Win32_UI_Shell",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }
rfd = "0.15"

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
