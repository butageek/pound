[package]
name = "pound"
version = "0.16.2"
edition = "2021"
description = "A small markdown reader with a side-by-side source pane"
license = "MIT"
authors = ["Hendry Chou"]
repository = "https://github.com/butageek/pound"
readme = "README.md"
keywords = ["markdown", "reader", "windows", "webview"]
categories = ["text-processing", "gui"]

[dependencies]
pulldown-cmark = "0.13"
ammonia = "4"
open = "5"
# RFC-4180 parsing for CSV/TSV tables (quoting, embedded newlines and
# delimiters, ragged rows via flexible mode); default-features off
# keeps serde out — we read untyped records only.
csv = { version = "1", default-features = false }
# Classed-span highlighting (colors live in the shell CSS, so the
# default themes dump is skipped); regex-fancy keeps the build pure
# Rust — no oniguruma C dependency for the MSVC release host.
syntect = { version = "5", default-features = false, features = [
  "default-syntaxes",
  "html",
  "parsing",
  "dump-load",
  "regex-fancy",
] }

[target.'cfg(windows)'.dependencies]
tao = "0.37"
wry = "0.57"
winreg = "0.55"
windows-sys = { version = "0.60", features = [
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
