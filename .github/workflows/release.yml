# Release: pushing a version tag (v0.2.1) builds the Windows zip via
# scripts/package.sh and publishes it as a GitHub Release with notes
# generated from the commits since the previous tag (this repo pushes
# directly to main, so GitHub's PR-based --generate-notes comes up empty).
# End users install with the irm one-liner in the README; tools/install.ps1
# fetches pound-<version>-win64.zip from the latest release.
#
# Built on windows-latest with the MSVC toolchain: WebView2Loader is linked
# STATICALLY on MSVC. The mingw (windows-gnu) cross-build imports
# WebView2Loader.dll dynamically (mingw cannot link Microsoft's static lib),
# which made v0.2.0 die at startup with STATUS_DLL_NOT_FOUND (0xC0000135)
# on machines without the DLL next to the exe.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: needed to list commits since the previous tag

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Unit tests
        run: cargo test

      - name: Build release zip (pound.exe + QUICK-START + LICENSE)
        shell: bash
        run: ./scripts/package.sh

      - name: Compose release notes from commits since the previous tag
        shell: bash
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            {
              echo "## What's Changed"
              git log --oneline "${PREV}..${GITHUB_REF_NAME}" \
                | sed 's/^\([0-9a-f]\{7,\}\) /- `\1` /'
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            } > release-notes.md
          fi

      - name: Create (or update) the GitHub Release with the zip attached
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: re-pushing/moving a tag updates the existing release
          # instead of failing on the name conflict. Titles carry only the
          # version number.
          NOTES_ARGS=(--title "${GITHUB_REF_NAME}")
          if [ -s release-notes.md ]; then
            NOTES_ARGS+=(--notes-file release-notes.md)
          else
            NOTES_ARGS+=(--generate-notes)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip "${NOTES_ARGS[@]}"
          fi
