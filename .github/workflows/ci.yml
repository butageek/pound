# Continuous integration: format check, clippy, unit tests and the Windows
# cross-compile check.
#
# Deliberately NOT triggered by everyday pushes (those are for preservation
# only) — run on demand with `gh workflow run CI.yml` or the Actions tab's
# "Run workflow" button. Pull requests are always checked, and version tags
# get the full validation via release.yml.

name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Install mingw-w64 (windows-gnu cross-checking + icon windres)
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Format check
        run: cargo fmt --all --check

      - name: Unit tests
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Windows target check
        run: cargo check --target x86_64-pc-windows-gnu --all-targets
