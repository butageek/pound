# Continuous integration: format check, clippy, unit tests and the Windows
# type-check.
#
# Deliberately NOT triggered by everyday pushes (those are for preservation
# only) — run on demand with `gh workflow run CI.yml` or the Actions tab's
# "Run workflow" button. Pull requests are always checked, and version tags
# get the full validation via release.yml.

name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all --check

      - name: Unit tests
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Type-check the Windows GUI code (the shipped toolchain is MSVC).
      # No linker or resource compiler is needed for a check; the icon is
      # only embedded in real builds.
      - name: Windows target check
        run: cargo check --target x86_64-pc-windows-msvc --all-targets
